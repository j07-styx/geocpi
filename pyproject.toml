[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geofuse-cpi"
version = "0.1.0"
description = "Research implementation of native geometry-augmented compound-protein affinity prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.1,<3",
  "lightgbm>=4.0,<5",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
raw = ["rdkit==2025.9.2", "fair-esm==2.0.0"]

[project.urls]
Repository = "https://github.com/j07-styx/geocpi"

[tool.setuptools.packages.find]
where = ["src"]
