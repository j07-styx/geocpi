name: Research smoke checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-raw.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-raw.txt
          python -m pip install -e . --no-deps
      - name: Verify aggregate results and synthetic pipeline
        run: |
          python verify.py
          python tests/smoke_test.py
          python tests/test_raw_input_guards.py
          python tests/test_import_compatibility.py
